<body-layout>

    <div content class="w-full min-h-dvh flex flex-col justify-center bg-linear-to-b
     from-cyan-50 via-slate-50 to-cyan-200
     items-center p-4">

        <form
                [formGroup]="form"
                #formDirective="ngForm"
                class="w-120 -translate-y-10 shadow-xs/20 flex flex-col p-4
                       rounded-2xl bg-boy-1 bg-center bg-no-repeat bg-contain"
                (ngSubmit)="onSubmit($event)">

            <div class="text-3xl mb-8 text-teal-800 font-flower font-bold text-shadow-sm/20
                        flex items-center justify-center">
                ❦ {{ title }} ❦
            </div>

            <mat-form-field appearance="outline" class="w-full my-4">

                <mat-label>아이디</mat-label>
                <input matInput required
                       placeholder="아이디 (이메일)"
                       class="font-bold text-teal-800"
                       formControlName="email">
                <mat-icon matPrefix
                          class="text-teal-800"
                          fontSet="material-icons-outlined">note
                </mat-icon>
                <mat-hint>가입시 등록한 이메일 주소를 넣어 주세요</mat-hint>
                @if (hasError('email', 'required')) {
                    <mat-error>이메일은 필수 항목입니다.</mat-error>
                }
                @if (hasError('email', 'email')) {
                    <mat-error>올바른 이메일 형식이 아닙니다.</mat-error>
                }

            </mat-form-field>

            <!-- 회신 주소 -->
            <mat-form-field appearance="outline" class="w-full">
                <mat-label>비밀번호 변경 회신주소</mat-label>
                <input matInput type="'text"
                       readonly="true" placeholder="확인주소"
                       class="text-teal-800 font-bold"

                       formControlName="replyUrl">
                <mat-icon matPrefix
                          class="text-teal-800"
                          fontSet="material-icons-outlined">note
                </mat-icon>
                <mat-hint>메일로 수신된 링크주소와 동일한지 확인 하세요.</mat-hint>
                @if (hasError('replyUrl', 'required')) {
                    <mat-error>회신주소는 필수 항목입니다.</mat-error>
                }
            </mat-form-field>

            <div class="flex flex-row justify-evenly gap-2 mt-4 items-center">
                <button matButton="outlined"
                        type="submit"
                        [disabled]="form.invalid || form.pending"
                        class="w-auto bg-sky-200/20 font-bold">
                    <mat-icon>send</mat-icon>
                    비밀번호 변경신청
                </button>
            </div>

        </form>
    </div>

</body-layout>
