<as-split [direction]="isMobile() ? 'vertical' : 'horizontal'"
          [useTransition]="true" unit="pixel"
          [gutterSize]="8"
          class="min-h-dvh bg-transparent">

  <as-split-area
                 [size]="showLeft() ? (isMobile() ? dynamicMobileHeight() : sidebarWidth()) : 0"
                 [minSize]="0"
                 [maxSize]="isMobile() ? 1000 : 500">

    <div #menuContent class="min-h-0">

      <!-- ── 왼쪽 사이드바 ── -->
      <div #sidebarContent class="relative bg-sidebar">

        <a type="button"
           class="w-full h-auto mt-3 flex justify-center items-center text-slate-400"
           [routerLink]="[home()]"
           routerLinkActive="active-link"
           (click)="accordion().closeAll()"
           [routerLinkActiveOptions]="{ exact: true }">
          <i class="bi bi-card-text text-2xl hover:text-amber-800/75"
             routerLinkActive="active-link"></i>
        </a>

        <mat-accordion class="m-3 border-none">

          <!-- 🔥 그룹 배열을 순회 - 패널 하나씩 생성 -->
          @for (group of resolvedGroups(); track group.id || $index) {

          <mat-expansion-panel
                               [expanded]="openedPanels().has($index)"
                               (opened)="onOpened($index)"
                               (closed)="onClosed($index)"
                               class="bg-slate-100">
            <!-- 패널 헤더 -->
            <mat-expansion-panel-header
                                        class="panel-header">
              <mat-panel-title class="flex items-center gap-2">
                @if (openedPanels().has($index)) {
                <!-- opened -->
                <i class="bi bi-collection-fill"></i>
                } @else {
                <!-- closed -->
                <i class="bi bi-collection"></i>
                }
                {{ group.title }}
              </mat-panel-title>
            </mat-expansion-panel-header>

            <!-- 🔥 메뉴 목록 -->
            @for (menu of group.children?.(); track menu.id ?? $index) {

            <!-- 메뉴 아이템 -->
            <mat-panel-description class="flex flex-row w-full pt-1 gap-2 justify-start">
              @if (!menu.disabled) {
              <button type="button"
                      class="btn-default shadow-2xs/10 cursor-pointer"
                      [routerLink]="menu.disabled ? null : menu.url"
                      [disabled]="menu.disabled"
                      (click)="onClickedMenuItem($event)"
                      [routerLinkActive]="['text-yellow-700']"
                      [routerLinkActiveOptions]="{ exact: menu?.exact ?? false }">
                <span class="flex gap-2 items-center font-oswald text-sm tracking-tight">
                  @if (menu.icon) {
                  <mat-icon fontSet="material-icons-outlined"> {{ menu.icon }} </mat-icon>
                  }
                  {{ menu.title }}
                </span>
              </button>
              }

            </mat-panel-description>
            }

          </mat-expansion-panel>
          }

        </mat-accordion>
      </div>
    </div>
  </as-split-area>

  <!-- Body -->
  <as-split-area>
    <router-outlet
                   [routerOutletData]="base.outletData()" />
  </as-split-area>

</as-split>
