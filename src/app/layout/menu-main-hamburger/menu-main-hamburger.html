<div class="flex gap-1 items-center justify-center">
  <!-- (신) 햄버거 메뉴 -->
  <button matIconButton [matMenuTriggerFor]="navMenu"
          class="text-white flex my-auto hover:text-yellow-200 cursor-pointer  justify-center items-center">
    <mat-icon aria-hidden="false" aria-label="main menu" fontIcon="menu"></mat-icon>
  </button>

  <mat-menu #navMenu="matMenu"
            [overlapTrigger]="false"
            class="absolute -translate-x-8 bg-slate-100 max-lg:z-100 mt-5">

    @for (menu of navGroup(); track $index) {
    <button mat-menu-item
            [routerLink]="[menu.url]"
            class="text-slate-500"
            [routerLinkActive]="['text-sky-600']">

      <mat-icon fontSet="material-icons-outlined" [routerLinkActive]="['text-sky-600']">{{menu.icon}}</mat-icon>
      <span
            [routerLinkActive]="['text-sky-600']"
            class="font-noto">{{ menu.title }}</span>

    </button>
    }

  </mat-menu>
