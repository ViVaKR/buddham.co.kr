@if (service().isLoading()) {
  <!-- <loading-state /> -->
  <div class="flex w-full h-screen text-2xl text-slate-400 justify-center items-center">
    데이터를 가져오는 중입니다...
  </div>
} @else if (service().error()) {
  <error-state (retry)="service().reload()"/>
  <div class="flex flex-col justify-center items-center min-h-0
     gap-4 p-6 bg-rose-50 rounded-2xl border
     border-rose-100">
    <mat-icon class="text-rose-500 scale-150">cloud_off</mat-icon>

    <div class="text-center">
      <p class="text-rose-800 font-bold text-lg">데이터를 가져오지 못했습니다.</p>
      <p class="text-rose-600/70 text-sm">네트워크 상태를 확인하고 다시 시도해주세요.</p>
    </div>

    <div class="flex gap-3 mt-2">
      <button matButton="outlined" (click)="service().reload()">
        <mat-icon>refresh</mat-icon>
        다시 시도
      </button>

      <button matButton="outlined" [routerLink]="['Home']" class="rounded-full">홈으로</button>

    </div>

    @if (isDev) {
      <pre
        class="mt-4 p-2 text-xs bg-black/5
       rounded text-left overflow-auto
       max-w-full">{{ service().error() | json }} </pre>
    }
  </div>
} @else {
  <ng-content></ng-content>
}
